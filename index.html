<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغامرة الحروف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe29f;--bg2:#ffa99f;--card:#fff;--ink:#3b2a63;--a:#7c4dff;--b:#ff7043;--c:#26c6da;--ok:#43a047;--bad:#e53935;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b1f55;--bg2:#4a2a6b;--card:#3a2d6b;--ink:#fff4d6}}
:root[data-theme="dark"]{--bg1:#2b1f55;--bg2:#4a2a6b;--card:#3a2d6b;--ink:#fff4d6}
html,body{margin:0;min-height:100%}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;text-align:center;user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:2.3rem;margin:.3em 0 0}
.sub{margin:0 0 14px;font-weight:600}
.mascot{font-size:5rem;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(5deg)}}
.btn{display:block;width:100%;border:0;border-radius:22px;padding:16px;margin:12px 0;font:800 1.4rem 'Cairo',Tahoma,sans-serif;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.b1{background:var(--a)}.b2{background:var(--b)}.b3{background:var(--c)}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1.2rem;margin-bottom:8px}
.back{background:var(--card);color:var(--ink);border:0;border-radius:14px;padding:6px 12px;font:800 1rem 'Cairo',Tahoma,sans-serif;cursor:pointer}
.bar{height:12px;background:rgba(255,255,255,.5);border-radius:8px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
.card{background:var(--card);border-radius:28px;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.pic{font-size:7rem;line-height:1.1;animation:pop .4s}
@keyframes pop{from{transform:scale(.3)}}
.q{font-size:1.4rem;font-weight:800;margin:6px 0 12px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{border:0;border-radius:18px;padding:14px 4px;font:800 2.2rem 'Cairo',Tahoma,sans-serif;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.opt.w{font-size:1.5rem}
.opt:nth-child(1){background:var(--a)}.opt:nth-child(2){background:var(--b)}.opt:nth-child(3){background:var(--c)}
.opt.ok{background:var(--ok)!important;animation:pop .4s}
.opt.no{background:var(--bad)!important;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.slots,.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:rtl;margin:10px 0}
.slot{width:54px;height:60px;border:3px dashed #b39ddb;border-radius:14px;font:800 2rem 'Cairo',Tahoma,sans-serif;line-height:56px}
.slot.f{border-style:solid;border-color:var(--ok)}
.tile{width:54px;height:60px;border:0;border-radius:14px;background:var(--b);color:#fff;font:800 2rem 'Cairo',Tahoma,sans-serif;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.tile:disabled{opacity:.25}
.say{background:#ffd54f;border:0;border-radius:50%;width:54px;height:54px;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.fb{min-height:2em;font-size:1.5rem;font-weight:800;margin-top:10px}
.stars{font-size:3.4rem;margin:8px 0}
.fly{position:fixed;font-size:2rem;pointer-events:none;animation:fly 1.2s ease-out forwards;z-index:9}
@keyframes fly{to{transform:translateY(-260px) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const W=[["🍎","تفاحة"],["🐱","قطة"],["🦁","أسد"],["🐫","جمل"],["🦆","بطة"],["🐘","فيل"],["🍌","موزة"],["🐟","سمكة"],["☀️","شمس"],["🌙","قمر"],["⭐","نجمة"],["🌹","وردة"],["📖","كتاب"],["✏️","قلم"],["🏠","بيت"],["🚗","سيارة"],["✈️","طائرة"],["🍇","عنب"],["🍉","بطيخ"],["🐴","حصان"]];
const EXTRA=["ز","د","ر","غ","ذ","ه","ص","خ"];
const app=document.getElementById('app');
let S={};
const sh=a=>[...a].sort(()=>Math.random()-.5);
const $=(h)=>app.innerHTML=h;
let ac;
function beep(f,d=.15,t='sine'){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const good=()=>{beep(660);setTimeout(()=>beep(880),120)};
const bad=()=>beep(180,.3,'square');
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function burst(){for(let i=0;i<10;i++){const e=document.createElement('div');e.className='fly';e.textContent=['⭐','🎉','✨','🌟'][i%4];e.style.left=(10+Math.random()*80)+'vw';e.style.top=(50+Math.random()*30)+'vh';document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}}

function home(){
$(`<div class="mascot">🦉</div><h1>مغامرة الحروف</h1><p class="sub">يلا نلعب ونتعلم العربي!</p>
<button class="btn b1" onclick="start('first')">🔤 أول حرف في الكلمة</button>
<button class="btn b2" onclick="start('pick')">🖼️ اختار الكلمة الصح</button>
<button class="btn b3" onclick="start('build')">🧩 رتّب الحروف</button>`)}

function start(m){S={m,q:sh(W).slice(0,10),i:0,score:0,lives:3};next()}
function hud(){return `<div class="hud"><button class="back" onclick="home()">🏠 الرئيسية</button><span>⭐ ${S.score}</span><span>${'❤️'.repeat(S.lives)}${'🖤'.repeat(3-S.lives)}</span></div><div class="bar"><i style="width:${S.i*10}%"></i></div>`}
function next(){
 if(S.i>=10||S.lives<=0)return end();
 const q=S.q[S.i],m=S.m;
 let body='';
 if(m==='first'){
  const L=q[1][0];const pool=sh([...new Set(W.map(w=>w[1][0]).concat(EXTRA))].filter(x=>x!==L)).slice(0,2);
  S.ans=L;body=`<div class="q">الكلمة بتبدأ بحرف إيه؟</div><div class="opts">${sh([L,...pool]).map(o=>`<button class="opt" onclick="pickA(this,'${o}')">${o}</button>`).join('')}</div>`;
 }else if(m==='pick'){
  const pool=sh(W.filter(w=>w!==q)).slice(0,2).map(w=>w[1]);
  S.ans=q[1];body=`<div class="q">إيه اسم الصورة دي؟</div><div class="opts">${sh([q[1],...pool]).map(o=>`<button class="opt w" onclick="pickA(this,'${o}')">${o}</button>`).join('')}</div>`;
 }else{
  const L=[...q[1]];let t=sh(L.map((c,k)=>k));while(L.length>1&&t.every((v,k)=>v===k))t=sh(t);
  S.got=[];S.L=L;S.t=t;
  body=`<div class="q">اضغط الحروف بالترتيب</div><div class="slots" id="sl"></div><div class="tiles" id="tl"></div>`;
 }
 $(`${hud()}<div class="card"><div class="pic">${q[0]}</div><button class="say" onclick="speak('${q[1]}')" aria-label="اسمع">🔊</button>${body}<div class="fb" id="fb"></div></div>`);
 if(m==='build')drawBuild();
}
function drawBuild(){
 document.getElementById('sl').innerHTML=S.L.map((c,k)=>`<div class="slot ${S.got[k]?'f':''}">${S.got[k]||''}</div>`).join('');
 document.getElementById('tl').innerHTML=S.t.map((ix,k)=>`<button class="tile" ${S.used&&S.used[k]?'disabled':''} onclick="tap(${k})">${S.L[ix]}</button>`).join('');
}
function tap(k){
 S.used=S.used||{};S.used[k]=1;S.got.push(S.L[S.t[k]]);beep(500,.08);drawBuild();
 if(S.got.length===S.L.length){
  const ok=S.got.join('')===S.L.join('');S.used=null;
  verdict(ok,null)
  if(!ok){S.got=[];setTimeout(()=>{if(S.lives>0&&S.i<10)drawBuild()},900)}
 }
}
function pickA(el,v){
 const ok=v===S.ans;
 el.classList.add(ok?'ok':'no');
 document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
 verdict(ok,el);
}
function verdict(ok,el){
 const fb=document.getElementById('fb');
 if(ok){S.score++;good();burst();fb.textContent=['برافو! 🎉','ممتاز! 🌟','شاطر! 👏'][S.i%3];speak(S.q[S.i][1]);S.i++;setTimeout(next,1300)}
 else{bad();S.lives--;fb.textContent='حاول تاني 💪';
  if(S.m!=='build'){S.i++;setTimeout(next,1300)}else if(S.lives<=0){setTimeout(next,1000)}}
}
function end(){
 const st=S.score>=9?3:S.score>=6?2:1;
 const msg=st===3?'أنت بطل العربي! 🏆':st===2?'شغل جميل جدًا!':'كويس! جرّب تاني وهتبقى أحسن';
 burst();good();
 $(`<div class="mascot">🦉</div><h1>${msg}</h1><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><p class="sub">جاوبت ${S.score} من 10 صح</p>
 <button class="btn b1" onclick="start('${S.m}')">🔁 العب تاني</button><button class="btn b2" onclick="home()">🏠 القائمة الرئيسية</button>`);
}
home();
</script>
</body>
</html>
